services:
  cookie-lab:
    build:
      context: ./cookie-lab
    container_name: e2e-cookie-lab
    expose:
      - "8000"

  logout:
    image: universal-logout:e2e
    pull_policy: never
    container_name: e2e-logout
    environment:
      LOGOUT_DOMAINS: "https://app.test.local,https://absent.test.local"
      LOGOUT_PORT: "8000"
    expose:
      - "8000"

  nginx:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    container_name: e2e-nginx
    depends_on:
      - cookie-lab
      - logout
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx.conf.example:/etc/nginx/conf.d/default.conf:ro
      - ./certs/tls.crt:/etc/nginx/certs/tls.crt:ro
      - ./certs/tls.key:/etc/nginx/certs/tls.key:ro
    networks:
      default:
        aliases:
          - app.test.local
          - logout.test.local
          - domain.test.local

  runner:
    build:
      context: ./runner
    container_name: e2e-runner
    depends_on:
      - nginx
    # no entrypoint/command override -> uses Dockerfile CMD ["npm","test"]
    environment:
      # inside the docker network nginx listens on 80/443
      BASE_HTTP: "http://app.test.local"
      BASE_HTTPS: "https://app.test.local"
      LOGOUT_HTTP: "http://logout.test.local"
      LOGOUT_HTTPS: "https://logout.test.local"
      FRAME_HTTPS: "https://app.test.local/frame"
      SWEPT_OK: "https://app.test.local"
      SWEPT_FAILING: "https://absent.test.local"
      PLAYWRIGHT_BROWSERS_PATH: "/ms-playwright"
      CATALOGUE: "/work/translations.yml"
    volumes:
      # the shipped catalogue itself, so the spec cannot drift from a copy
      - ../../translations.yml:/work/translations.yml:ro
