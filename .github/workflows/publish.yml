name: Publish Docker Image

on:
  workflow_call:

jobs:
  publish:
    name: Publish the tested images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image name
        id: image
        run: |
          set -euo pipefail
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          repo="$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/${repo}" >> "${GITHUB_OUTPUT}"

      - name: Download the tested images
        uses: actions/download-artifact@v8
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push one tag per architecture
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            docker load --input "${RUNNER_TEMP}/images/image-${arch}/image.tar"
            docker tag universal-logout:e2e "${IMAGE}:${REF_NAME}-${arch}"
            docker push "${IMAGE}:${REF_NAME}-${arch}"
          done

      - name: Join both architectures under the release tags
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tags=(-t "${IMAGE}:${REF_NAME}")
          newest="$(git tag --list 'v*' | sort -V | tail -n1)"
          if [ "${REF_NAME}" = "${newest}" ]; then
            tags+=(-t "${IMAGE}:latest")
          fi
          docker buildx imagetools create "${tags[@]}" \
            "${IMAGE}:${REF_NAME}-amd64" \
            "${IMAGE}:${REF_NAME}-arm64"
          docker buildx imagetools inspect "${IMAGE}:${REF_NAME}"
