name: E2E (Playwright + Docker Compose)

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev dependencies
        run: make install-dev

      - name: Run unit tests
        run: make test-unit

  fuzz:
    name: Fuzz the hand-off guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install fuzzing dependencies
        run: pip install --require-hashes -r requirements.txt -r tests/fuzz/requirements.txt

      - name: Fuzz the hand-off guard
        run: make test-fuzz

  build:
    name: Build image
    needs: unit
    uses: ./.github/workflows/build.yml

  e2e:
    name: Run E2E tests (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download the image the build job produced
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: image-${{ matrix.arch }}
          path: ${{ runner.temp }}

      - name: Load the image
        run: docker load --input "${{ runner.temp }}/image.tar"

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Run E2E tests against the loaded image
        run: make test-e2e-run

      # If anything fails above, print container logs to make debugging easy.
      - name: Dump docker compose logs on failure
        if: failure()
        run: |
          set -euo pipefail
          cd tests/e2e
          docker compose ps || true
          docker compose logs --no-color || true

      # Always try to clean up, so the runner is left tidy.
      - name: Cleanup (always)
        if: always()
        run: |
          set -euo pipefail
          cd tests/e2e
          docker compose down -v --remove-orphans || true
          docker system df || true
