name: Push (Coordinator)

on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Run E2E tests
    uses: ./.github/workflows/e2e.yml

  publish:
    name: Publish the tested images
    needs: e2e
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      packages: write
